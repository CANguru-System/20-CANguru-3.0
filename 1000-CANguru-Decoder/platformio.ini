; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
platform = espressif32
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -DMONITOR_SPEED=115200
    -I src/decoder/core/generated_constants
	-I src/decoder
	-I src/decoder/core
	-I src/decoder/features
; teilt der Software mit, dass es sich um einen Decoder handelt; damit  werden in espnow.h die LEDs gesteuert 
;;;;; Possible options ;;;;;;
; None
; -DCORE_DEBUG_LEVEL=0
; Error
; -DCORE_DEBUG_LEVEL=1
; Warn
; -DCORE_DEBUG_LEVEL=2
; Info
; -DCORE_DEBUG_LEVEL=3
; Debug
 -DCORE_DEBUG_LEVEL=4
; Verbose
; -DCORE_DEBUG_LEVEL=5
;Was passiert hier?
; ✔ extends = env
; Der Decoder erbt alle globalen Einstellungen.

; ✔ ${env.build_flags}
; Der Decoder erbt die globalen Build‑Flags.

; ✔ -DDECODER_TYPE=…
; Damit weiß deine Factory, welchen Decoder sie erzeugen soll.

; ✔ -Isrc/decoder/features/<typ>
; Nur dieser Decoder bekommt seine Feature‑Header.

[env:signal]
board = esp32-c3-devkitm-1
; change microcontroller
board_build.mcu = esp32c3
build_flags =
    ${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
    -DDECODER_TYPE=0x51
    -Isrc/decoder/features/signal

[env:switch]
board = esp32-c3-devkitm-1
; change microcontroller
board_build.mcu = esp32c3
build_flags =
    ${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
    -DDECODER_TYPE=0x52
    -Isrc/decoder/features/switch
  
[env:power]
board = esp32-c3-devkitm-1
; change microcontroller
board_build.mcu = esp32c3
build_flags =
    ${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
    -DDECODER_TYPE=0x53
    -Isrc/decoder/features/power
lib_deps =
  https://github.com/adafruit/Adafruit_INA3221.git

[env:feedback]
board = nodemcu-32s
; change microcontroller
board_build.mcu = esp32
build_flags =
    ${env.build_flags}
    ${env.build_flags}
    -DDECODER_TYPE=0x54
    -Isrc/decoder/features/feedback
